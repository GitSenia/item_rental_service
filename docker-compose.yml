services:
  postgres:
    image: postgres:17.4-alpine
    container_name: rental-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: rental
      POSTGRES_PASSWORD: rental
      POSTGRES_DB: rental
    ports:
      - "5433:5432"
    volumes:
      - rental_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rental -d rental"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    image: rental-api:latest
    container_name: rental-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://rental:rental@postgres:5432/rental
      DB_SSL: "false"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  rental_pg_data:
